## SvenCo-op map CFG file - HL SP Map 
## Map By: Wolf-3D
nomaptrans sc45op_escort2
nextmap sc45op_escort4
skill 1
mp_radiovoice 1

mp_allowmonsterinfo 0
#weapon_grapple
#mp_grapple_mode 0

## starthealth & startarmor are prone to be overridden by BOTH GPE inistalisation and XP.
starthealth 200
startarmor 200
## killnpc has been replaced by mp_npckill
mp_npckill 1
## 0 = Player-allied monsters have god mode.
## 1 = Normal behavior - Player-allied monsters can get killed by anything.
## 2 = Special setting - Player-allied monsters can get killed by anything EXCEPT players. 
##
##nosuit
## This starts the player without a HEV suit, this means the players will be unable to
## easily change weapons and will be unable to see the hud, so only use it when you feel
## it is necessary or the player is to get a HEV suit later in the map.
##nomedkit   
## Default is player starts with medKit.
##item_longjump  
## Equip players at spawn with the Long Jump Module

## mp_banana has special precache model.
mp_banana 1
## Set this if you don't want 10 gren throw.
## Set to 0 if you DON'T want players to get frags for killing monsters,
## i.e. Sven Co-op lets players get points for killing monsters.
mp_monsterpoints 1
## Map time limit, in minutes. (For those that cannot complete the map.)
mp_timelimit 60
## Map frag limit. Not recommended in most circumstances,
## Setting this to a number will change the map when a player reaches that number of frags.
mp_fraglimit 0
## File with list of maps to cycle through, in order
## mapcyclefile mapcycle.txt
## Setting of 1 allows players to use flashlight. 0 = no Flashlight.
mp_flashlight 1
## Setting of 1 enables 'realistic' falling damage
mp_falldamage 1
## Setting of 1 forces players to respawn about a sec after death
## May have changed/renamed to "forcerespawn"
mp_forcerespawn 0

## Setting of 0 makes weapons disappear after they're picked up
## Weapons will respawn after a while, like ammo does.
## This means other players will have to wait to get the weapon. 
## If set to 1 then all players can pick up the weapon without waiting for respawn.
## It is better to equip players on spawn.
mp_weaponstay 0
## set no. of spawn points 0 = A spawn point(single Player) or 1 = Multispawn points.
mp_multiplespawn 1
## Disable Guall Gun/charge jumping = 0.
mp_allowgaussjump 0
## Boolean ??
mp_disablegaussjump 1
## Physics stuff. 
## Don't change unless you know what Ur doing
sv_accelerate 10
sv_airaccelerate 10
sv_airmove 1
sv_friction 4
sv_gravity 800
sv_maxspeed 270
sv_wateraccelerate 10
sv_waterfriction 1
## Remove some models to free up memory
globalmodellist ../../maps/sc_retrieval2.gmr
forcepmodels dm_gordon;dm_colette;dm_gina;dm_helmet
map_script survival_generic
