## Place starting weapon_ and ammo_ cmds here (players spawn with them)
## Ammo cmds MUST have a number after them!, as with the 9mm cmd below.
## Can also use 'item_longjump', and 'nosuit' (Nosuit not recommeded!)

weapon_glock
weapon_crowbar
weapon_pipewrench
ammo_9mm 250

skill 1
mp_multiplespawn 0
mp_monsterpoints 1
mp_timelimit 30
mp_fraglimit 0
mp_flashlight 1
mp_falldamage 0
mp_forcerespawn 0
mp_weaponstay 1
mp_radiovoice 1
mp_allowgaussjump 1


## Physics stuff. 
## Don't change unless you know what you're doing!!
sv_accelerate 10
sv_airaccelerate 10
sv_airmove 1
sv_friction 4
sv_gravity 800
sv_maxspeed 400
sv_wateraccelerate 10
sv_waterfriction 1
map_script survival_generic
