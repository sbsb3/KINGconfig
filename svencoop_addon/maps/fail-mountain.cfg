// Starting equipment
starthealth 100
startarmor 0

weapon_medkit
weapon_crowbar
weapon_glock

ammo_9mm 3


// Server variables
sv_accelerate 10
sv_airaccelerate 10
sv_airmove 1
sv_friction 4
sv_gravity 800
sv_maxspeed 270
sv_wateraccelerate 10
sv_wateramp 0
sv_waterfriction 1
sv_zmax 11264


// Multi-player / Sven Co-op variables
mp_allowmonsterinfo 1
mp_banana 1
mp_disable_autoclimb 0
mp_disable_pcbalancing 0
mp_disable_player_rappel 0
mp_disablegaussjump 0
mp_dropweapons 1
mp_falldamage 1
mp_flashlight 1
mp_fraglimit 0
mp_grapple_mode 1
mp_multiplespawn 1
mp_no_akimbo_uzis 0
mp_npckill 2
mp_respawndelay 5
mp_timelimit 90
mp_weaponstay 1
plrstart_zoffset 4	// Raise player start points off the ground by this many units


// Sven Co-op 4 - Weapon secondary fire modes
weaponmode_wrench 0		// Set to disable power swing
weaponmode_9mmhandgun 0	// Set to have silencer instead of rapid fire
weaponmode_357 0		// Set to disable the zoom/scope
weaponmode_mp5 0		// Set to disable the zoom/scope
weaponmode_shotgun 0	// Set for double blast instead of rapid fire
weaponmode_crossbow 0	// Set to disable exploding bolts
weaponmode_m16 0		// Set to disable grenade launcher
weaponmode_rpg 0		// Set to disable laser sight


// Global replacement files
globalmodellist ../../maps/fail-mountain.gmr
map_script survival_generic
