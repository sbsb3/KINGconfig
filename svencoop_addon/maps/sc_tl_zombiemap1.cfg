starthealth 500
startarmor 500
weapon_medkit
weapon_glock
weapon_crowbar
weapon_shotgun
ammo_9mm 25
ammo_buckshot 4

skill 2

## 如果这地图只有一个出生点，就改为"1" (在单人地图用svencoop时选这项)
mp_multiplespawn 1

## 如果你不想让玩家杀敌时得分，把这项改成"0"
mp_monsterpoints 1

## 能否用手电筒,1为能
mp_flashlight 1

## 设成"1"为掉落真实伤害，设为"0"掉下只减10hp
mp_falldamage 0

## 武器停留，拿一个出一个，但不能再拿一次
## (They'll respawn after a while, like ammo does).
mp_weaponstay 1

## 如果你想用高斯来跳的话，改成1
mp_allowgaussjump 1

## 能否杀害友好NPC？设为"0"的话，NPC无敌

killnpc 0

## Physics stuff. 
##基本指令，如果你不懂，请不要修改
sv_accelerate 10
sv_airaccelerate 10
sv_airmove 1
sv_friction 4
##重力，800正常
sv_gravity 800
##脚步，越大人走得越快
sv_maxspeed 250
sv_wateraccelerate 10
sv_waterfriction 1













